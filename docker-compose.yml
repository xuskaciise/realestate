services:
  db:
    image: postgres:16-alpine
    container_name: realestate-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # PostgreSQL only on loopback with non-default host port (optional admin / backups from host)
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  app:
    image: ${APP_IMAGE:-ghcr.io/xuskaciise/realestate:latest}
    container_name: realestate-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # DATABASE_URL must be set in .env (host name `db`, port 5432). URL-encode special characters in the password.
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal

  minio:
    image: minio/minio
    container_name: realestate-storage
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_BROWSER_REDIRECT_URL: https://s3.siulabs.so/minio/ui
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - internal

volumes:
  postgres_data:
    name: realestate_postgres_data
  minio_data:
    name: realestate_minio_data

networks:
  internal:
    driver: bridge